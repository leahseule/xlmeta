# EC2 운영 파일 — 포트 미노출, Weave의 기존 Caddy(weave_default) 뒤에 붙는다.
# 챗봇(그래프 Q&A)을 쓰려면 서버의 .env에 NEO4J_URI·NEO4J_PASSWORD(+OPENAI_API_KEY)를 넣어야 한다.
# Neo4j는 이 인스턴스(909MB, 프리티어)에 올릴 메모리 여유가 없어서 Neo4j Aura(무료 클라우드,
# 이 서버 밖)를 쓴다 — 그래서 여기엔 neo4j 서비스가 없다. 2026-09-07 메모리 부족으로
# 로컬 Neo4j 컨테이너 반복 OOM 겪은 뒤 이 구조로 변경.
# 갱신: cd ~/xlmeta && git pull && docker compose -f docker-compose.caddy.yml up -d --build
services:
  xlmeta:
    build: .
    image: xlmeta:latest
    container_name: xlmeta
    environment:
      PORT: "8000"
      XLMETA_DATA_DIR: /data/summaries
      # Q&A('이 엑셀에 물어보기')·그래프 챗봇 둘 다 이 키가 있어야 켜진다. 없으면 둘 다 비활성.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 그래프 챗봇 전용. Neo4j Aura 콘솔에서 받은 값을 그대로 .env에 넣는다
      # (URI는 neo4j+s://로 시작 — Aura가 발급하는 그대로 붙여넣으면 됨).
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - xlmeta_data:/data
    networks:
      - weave_default
    restart: unless-stopped

volumes:
  xlmeta_data:

networks:
  weave_default:
    external: true
