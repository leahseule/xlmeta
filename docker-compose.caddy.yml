# EC2 운영 파일 — 포트 미노출, Weave의 기존 Caddy(weave_default) 뒤에 붙는다.
# 챗봇(그래프 Q&A)을 쓰려면 서버의 .env에 NEO4J_PASSWORD(+OPENAI_API_KEY)를 넣어야 한다.
# 갱신: cd ~/xlmeta && git pull && docker compose -f docker-compose.caddy.yml up -d --build
services:
  xlmeta:
    build: .
    image: xlmeta:latest
    container_name: xlmeta
    environment:
      PORT: "8000"
      XLMETA_DATA_DIR: /data/summaries
      # Q&A('이 엑셀에 물어보기')·그래프 챗봇 둘 다 이 키가 있어야 켜진다. 없으면 둘 다 비활성.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 그래프 챗봇 전용. neo4j는 이 컴포즈 안의 서비스명이라 도메인/포트 노출 없이 내부통신.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - xlmeta_data:/data
    networks:
      - weave_default
    depends_on:
      - neo4j
    restart: unless-stopped

  # 그래프 챗봇 전용 DB. 호스트에 포트를 절대 열지 않는다(ports: 없음) — xlmeta 컨테이너만
  # 도커 내부망(weave_default)으로 bolt://neo4j:7687에 접근. 공개 인터넷에서 접근 불가.
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'   # graph_qa.py의 스키마 조회에 필요
    volumes:
      - neo4j_data:/data
    networks:
      - weave_default
    mem_limit: 1g   # 인스턴스 사양 보고 조정할 것 (t3.small=2GB 기준 보수적으로 잡음)
    restart: unless-stopped

volumes:
  xlmeta_data:
  neo4j_data:

networks:
  weave_default:
    external: true
