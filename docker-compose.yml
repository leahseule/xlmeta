# EC2에서 한 줄로 올리고 내리는 운영 파일:  docker compose up -d --build
services:
  xlmeta:
    build: .
    image: xlmeta:latest
    container_name: xlmeta
    ports:
      - "80:8000"                 # http://<EC2-공개주소> 로 바로 접근 (링크에 포트 안 붙음)
    environment:
      PORT: "8000"
      XLMETA_DATA_DIR: /data/summaries
      # Q&A('이 엑셀에 물어보기')·그래프 챗봇 둘 다 이 키가 있어야 켜진다.
      # 없으면 코어는 정상 동작하고 Q&A·챗봇만 꺼진 채(비활성) 나온다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 그래프 챗봇 전용. 로컬에 Neo4j를 안 띄우고 Neo4j Aura(무료 클라우드)를 쓴다 —
      # 작은 인스턴스엔 Neo4j를 올릴 메모리 여유가 없어서(909MB 인스턴스에서 OOM 반복 겪음).
      # Aura 콘솔에서 받은 값을 그대로 .env에 넣는다(URI는 neo4j+s://로 시작).
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - xlmeta_data:/data         # /s/<id> 요약이 컨테이너 재시작에도 살아남게
    restart: unless-stopped

volumes:
  xlmeta_data:
