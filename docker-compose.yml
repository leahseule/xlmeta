# EC2에서 한 줄로 올리고 내리는 운영 파일:  docker compose up -d --build
services:
  xlmeta:
    build: .
    image: xlmeta:latest
    container_name: xlmeta
    ports:
      - "80:8000"                 # http://<EC2-공개주소> 로 바로 접근 (링크에 포트 안 붙음)
    environment:
      PORT: "8000"
      XLMETA_DATA_DIR: /data/summaries
      # Q&A('이 엑셀에 물어보기')·그래프 챗봇 둘 다 이 키가 있어야 켜진다.
      # 없으면 코어는 정상 동작하고 Q&A·챗봇만 꺼진 채(비활성) 나온다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 그래프 챗봇 전용. neo4j는 아래 서비스명이라 포트 노출 없이 내부통신으로 붙는다.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - xlmeta_data:/data         # /s/<id> 요약이 컨테이너 재시작에도 살아남게
    depends_on:
      - neo4j
    restart: unless-stopped

  # 그래프 챗봇 전용 DB. 호스트에 포트를 절대 열지 않는다(ports: 없음) — xlmeta 컨테이너만
  # 도커 내부망으로 bolt://neo4j:7687에 접근. 공개 인터넷에서 접근 불가.
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'   # graph_qa.py의 스키마 조회에 필요
    volumes:
      - neo4j_data:/data
    mem_limit: 1g   # 인스턴스 사양 보고 조정할 것
    restart: unless-stopped

volumes:
  xlmeta_data:
  neo4j_data:
